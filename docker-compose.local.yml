services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-eco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env (voir .env.example)}
      POSTGRES_DB: ${DB_NAME:-eco_tourism}
    ports:
      # 127.0.0.1 : accessible depuis la machine locale uniquement, jamais depuis le réseau
      - "127.0.0.1:5432:5432"
    volumes:
      - tourisme_pgdata_local:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - tourisme_mongodata_local:/data/db

volumes:
  tourisme_pgdata_local:
  tourisme_mongodata_local:
